name: validate-plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Marketplace and plugin
        run: npx -y @anthropic-ai/claude-code@2.1.310 plugin validate --strict .
      - name: Directory profile
        run: npx -y @anthropic-ai/claude-code@2.1.310 plugin validate --strict --profile directory plugin
